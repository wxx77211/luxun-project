<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鲁迅女性人物知识地图</title>
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "楷体", "行楷", SimKai, STKaiti, sans-serif;
        }
        
        body {
            overflow: hidden;
            height: 100vh;
            background-color: #f5f0e8;
        }
        
        /* 页面容器通用样式 */
        .page {
            width: 100%;
            height: 100%;
            display: none;
            position: relative;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        .page.active {
            display: block;
        }
        
        /* 第一层：首页 */
        #page1 {
            background-image: url(https://pic1.imgdb.cn/item/69aff95f6738cb8aa1297124.jpg);
        }
        
        .luxun-photo {
            position: absolute;
            top: 50%;
            right: 20%;
            transform: translateY(-50%);
            width: 280px;
            height: auto;
        }
        
        .title-container {
            position: absolute;
            top: 50%;
            left: 15%;
            transform: translateY(-50%);
        }
        
        .main-title {
            font-size: 56px;
            color: #000;
            font-weight: normal;
            margin-bottom: 20px;
        }
        
        .sub-title {
            font-size: 32px;
            color: #000;
            font-weight: normal;
        }
        
        .start-btn {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 40px;
            color: #000;
            cursor: pointer;
            padding: 15px 40px;
            border: 2px solid #000;
            background-color: rgba(255, 255, 255, 0.6);
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        
        .start-btn:hover {
            background-color: rgba(255, 255, 255, 0.8);
            transform: translateX(-50%) scale(1.05);
        }
        
        /* 第二层：人物一览 */
        #page2 {
            background-color: #f5f0e8;
            background-image: linear-gradient(rgba(245, 240, 232, 0.8), rgba(245, 240, 232, 0.8)), 
                              url(https://pic1.imgdb.cn/item/69aff95f6738cb8aa1297124.jpg);
        }
        
        .btn-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 80px;
        }
        
        .category-btn {
            font-size: 36px;
            color: #000;
            cursor: pointer;
            padding: 20px 50px;
            border: 2px solid #000;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        
        .category-btn:hover {
            background-color: rgba(255, 255, 255, 0.9);
            transform: scale(1.05);
        }
        
        /* 第三层：地点选择页（虚拟/现实） */
        #page3-virtual, #page3-real {
            padding-bottom: 120px;
        }
        
        #page3-virtual {
            background-image: url(https://pic1.imgdb.cn/item/69aff99f6738cb8aa129715e.png);
        }
        
        #page3-real {
            background-image: url(https://pic1.imgdb.cn/item/69aff9f96738cb8aa12971b3.png);
        }
        
        .location-container {
            position: absolute;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 90%;
        }
        
        .location-btn {
            font-size: 24px;
            color: #000;
            cursor: pointer;
            padding: 12px 24px;
            border: 2px solid #000;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 6px;
            transition: all 0.3s ease;
        }
        
        .location-btn:hover {
            background-color: rgba(255, 255, 255, 0.9);
            transform: scale(1.05);
        }
        
        /* 第三层：人物头像展示页 */
        #page3-characters {
            background-color: #f5f0e8;
            background-image: linear-gradient(rgba(245, 240, 232, 0.9), rgba(245, 240, 232, 0.9)), 
                              url(https://pic1.imgdb.cn/item/69aff95f6738cb8aa1297124.jpg);
        }
        
        .avatar-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            width: 80%;
        }
        
        .avatar-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }
        
        .avatar-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid #8b4513;
            object-fit: cover;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        
        .avatar-img:hover {
            transform: scale(1.1);
            border-color: #000;
        }
        
        .avatar-name {
            font-size: 24px;
            color: #000;
        }
        
        /* 第四层：人物详情页 */
        #page4-detail {
            background-color: #f5f0e8;
            padding: 40px;
            overflow-y: auto;
        }
        
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 20px;
            color: #000;
            cursor: pointer;
            padding: 8px 16px;
            border: 1px solid #000;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 4px;
            z-index: 999;
        }
        
        .detail-title {
            text-align: center;
            font-size: 48px;
            color: #000;
            margin-bottom: 40px;
            border-bottom: 2px solid #000;
            padding-bottom: 20px;
        }
        
        .detail-section {
            margin-bottom: 40px;
        }
        
        .section-title {
            font-size: 36px;
            color: #8b4513;
            margin-bottom: 20px;
            border-left: 8px solid #8b4513;
            padding-left: 15px;
        }
        
        .section-content {
            font-size: 20px;
            line-height: 1.8;
            color: #333;
            text-indent: 2em;
        }
        
        .journal-list {
            font-size: 20px;
            line-height: 1.8;
            color: #333;
            list-style-position: inside;
            padding-left: 2em;
        }
        
        /* 响应式适配 */
        @media (max-width: 1200px) {
            .luxun-photo {
                width: 220px;
            }
            .main-title {
                font-size: 48px;
            }
            .sub-title {
                font-size: 28px;
            }
            .avatar-img {
                width: 120px;
                height: 120px;
            }
        }
        
        @media (max-width: 768px) {
            .luxun-photo {
                width: 180px;
                right: 10%;
            }
            .title-container {
                left: 10%;
            }
            .main-title {
                font-size: 36px;
            }
            .sub-title {
                font-size: 24px;
            }
            .btn-container {
                flex-direction: column;
                gap: 40px;
            }
            .category-btn {
                font-size: 28px;
                padding: 15px 30px;
            }
            .detail-title {
                font-size: 36px;
            }
            .section-title {
                font-size: 28px;
            }
            .section-content, .journal-list {
                font-size: 18px;
            }
        }
        
        /* AI智能查询样式 */
        .ai-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.5);
        }
        
        .ai-modal-content {
            background-color: #f5f0e8;
            margin: 15% auto;
            padding: 20px;
            border: 2px solid #000;
            border-radius: 8px;
            width: 80%;
            max-width: 800px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            background-image: linear-gradient(rgba(245, 240, 232, 0.9), rgba(245, 240, 232, 0.9)), 
                              url(https://pic1.imgdb.cn/item/69aff95f6738cb8aa1297124.jpg);
        }
        
        .ai-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #8b4513;
        }
        
        .ai-modal-header h3 {
            font-size: 28px;
            color: #000;
            font-weight: normal;
            margin: 0;
        }
        
        .ai-close {
            color: #000;
            float: right;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .ai-close:hover {
            color: #8b4513;
        }
        
        .ai-modal-body {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .ai-chat-container {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #000;
            border-radius: 6px;
            padding: 15px;
            background-color: rgba(255, 255, 255, 0.8);
        }
        
        .ai-message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        
        .ai-message.user {
            align-items: flex-end;
        }
        
        .ai-message.ai {
            align-items: flex-start;
        }
        
        .ai-message-content {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 18px;
            line-height: 1.6;
        }
        
        .ai-message.user .ai-message-content {
            background-color: #e6e6fa;
            border: 1px solid #8b4513;
        }
        
        .ai-message.ai .ai-message-content {
            background-color: #f0f0f0;
            border: 1px solid #000;
        }
        
        .ai-message-label {
            font-size: 14px;
            margin-bottom: 5px;
            color: #8b4513;
        }
        
        .ai-input-container {
            display: flex;
            gap: 10px;
        }
        
        .ai-input {
            flex: 1;
            padding: 12px 16px;
            font-size: 18px;
            border: 2px solid #000;
            border-radius: 6px;
            background-color: rgba(255, 255, 255, 0.8);
            font-family: "楷体", "行楷", SimKai, STKaiti, sans-serif;
        }
        
        .ai-input:focus {
            outline: none;
            border-color: #8b4513;
        }
        
        .ai-submit-btn {
            padding: 0 24px;
            font-size: 18px;
            color: #000;
            border: 2px solid #000;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: "楷体", "行楷", SimKai, STKaiti, sans-serif;
        }
        
        .ai-submit-btn:hover {
            background-color: rgba(255, 255, 255, 0.9);
            transform: scale(1.05);
        }
        
        @media (max-width: 768px) {
            .ai-modal-content {
                width: 95%;
                margin: 20% auto;
            }
            
            .ai-chat-container {
                height: 300px;
            }
            
            .ai-input {
                font-size: 16px;
            }
            
            .ai-submit-btn {
                font-size: 16px;
                padding: 0 16px;
            }
        }
    </style>
</head>
<body>
    <!-- 第一层：首页 -->
    <div id="page1" class="page active">
        <img src="https://s41.ax1x.com/2026/03/09/peioNd0.png" alt="鲁迅" class="luxun-photo">
        <div class="title-container">
            <h1 class="main-title">鲁迅女性人物知识地图</h1>
            <p class="sub-title">Lu Xun & female character</p>
        </div>
        <div class="start-btn" onclick="goToPage('page2')">开始</div>
        <div class="start-btn ai-btn" onclick="openAIQuery()" style="bottom: 25%;">AI智能查询</div>
    </div>

    <!-- 第二层：人物一览 -->
    <div id="page2" class="page">
        <div class="btn-container">
            <div class="category-btn" onclick="goToPage('page3-virtual')">虚拟人物地图</div>
            <div class="category-btn" onclick="goToPage('page3-real')">现实人物地图</div>
        </div>
        <div class="back-btn" onclick="goToPage('page1')">返回</div>
    </div>

    <!-- 第三层：虚拟人物地点选择 -->
    <div id="page3-virtual" class="page">
        <div class="location-container">
            <div class="location-btn" onclick="showCharacters('虚拟', '古轩亭口')">古轩亭口</div>
            <div class="location-btn" onclick="showCharacters('虚拟', '鲁镇')">鲁镇</div>
            <div class="location-btn" onclick="showCharacters('虚拟', '庞庄')">庞庄</div>
            <div class="location-btn" onclick="showCharacters('虚拟', '故乡')">故乡</div>
            <div class="location-btn" onclick="showCharacters('虚拟', '吉兆胡同')">吉兆胡同</div>
            <div class="location-btn" onclick="showCharacters('虚拟', '后羿居所')">后羿居所</div>
            <div class="location-btn" onclick="showCharacters('虚拟', '首阳山')">首阳山</div>
        </div>
        <div class="back-btn" onclick="goToPage('page2')">返回</div>
    </div>

    <!-- 第三层：现实人物地点选择 -->
    <div id="page3-real" class="page">
        <div class="location-container">
            <div class="location-btn" onclick="showCharacters('现实', '上海')">上海</div>
            <div class="location-btn" onclick="showCharacters('现实', '绍兴')">绍兴</div>
            <div class="location-btn" onclick="showCharacters('现实', '北京')">北京</div>
            <div class="location-btn" onclick="showCharacters('现实', '柏林')">柏林</div>
        </div>
        <div class="back-btn" onclick="goToPage('page2')">返回</div>
    </div>

    <!-- 第三层：人物头像展示 -->
    <div id="page3-characters" class="page">
        <div class="avatar-container" id="character-avatar-container">
            <!-- 动态加载人物头像 -->
        </div>
        <div class="back-btn" onclick="goBackFromCharacters()">返回</div>
    </div>

    <!-- 第四层：人物详情 -->
    <div id="page4-detail" class="page">
        <div class="back-btn" onclick="goToPage('page3-characters')">返回</div>
        <h2 class="detail-title" id="detail-name"></h2>
        <div class="detail-section">
            <h3 class="section-title">人物简介</h3>
            <p class="section-content" id="detail-intro"></p>
        </div>
        <div class="detail-section">
            <h3 class="section-title">学术期刊</h3>
            <ul class="journal-list" id="detail-journal"></ul>
        </div>
    </div>

    <!-- AI智能查询模态框 -->
    <div id="ai-modal" class="ai-modal">
        <div class="ai-modal-content">
            <div class="ai-modal-header">
                <h3>AI智能查询</h3>
                <span class="ai-close" onclick="closeAIQuery()">&times;</span>
            </div>
            <div class="ai-modal-body">
                <div class="ai-chat-container" id="ai-chat-container">
                    <!-- 对话内容将动态添加 -->
                </div>
                <div class="ai-input-container">
                    <input type="text" id="ai-input" placeholder="请输入关于鲁迅笔下女性人物的问题，如：祥林嫂的人物形象分析、许广平与鲁迅的关系" class="ai-input">
                    <button onclick="submitAIQuery()" class="ai-submit-btn">发送</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // AI智能查询功能
        function openAIQuery() {
            document.getElementById('ai-modal').style.display = 'block';
        }
        
        function closeAIQuery() {
            document.getElementById('ai-modal').style.display = 'none';
        }
        
        function submitAIQuery() {
            const input = document.getElementById('ai-input');
            const question = input.value.trim();
            if (question) {
                addMessage('user', question);
                input.value = '';
                setTimeout(() => {
                    const answer = generateAIAnswer(question);
                    addMessage('ai', answer);
                }, 500);
            }
        }
        
        // 回车键提交查询
        document.getElementById('ai-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                submitAIQuery();
            }
        });
        
        function addMessage(type, content) {
            const chatContainer = document.getElementById('ai-chat-container');
            const messageDiv = document.createElement('div');
            messageDiv.className = `ai-message ${type}`;
            messageDiv.innerHTML = `
                <div class="ai-message-label">${type === 'user' ? '用户' : 'AI'}</div>
                <div class="ai-message-content">${content}</div>
            `;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        function generateAIAnswer(question) {
            question = question.toLowerCase();
            
            // 基于人物数据生成回答
            if (question.includes('祥林嫂')) {
                return '祥林嫂是鲁迅《祝福》中的经典人物，她是被礼教咀嚼殆尽的精神祭品。作为连续丧夫失子的底层劳动妇女，她初到鲁镇时以沉默的劳动换取生存，展现了惊人的忍耐力与生命力。然而，她被婆婆绑架改嫁时以死抗争，失子后寻求情感共鸣却被乡邻“咀嚼赏鉴”成渣滓，最终在柳妈的“地狱恐吓”中陷入精神深渊。捐门槛后仍被四婶喝止触碰祭品，宣告其“赎罪”的彻底失败，最终在“祝福”的喧闹中孤独死去。她的悲剧是夫权、族权、神权、政权合力围剿的结果。';
            } else if (question.includes('许广平')) {
                return '许广平（1898—1968），笔名景宋，广东番禺人，现代作家、社会活动家，鲁迅的伴侣与战友。早年投身五四运动，后考入北京女子高等师范学校，成为鲁迅学生，积极参与学生运动。1925年起与鲁迅通信相恋，二人通信结集为《两地书》。1927年后与鲁迅在上海共同生活，全力协助鲁迅文稿整理、编辑与对敌斗争。鲁迅逝世后，她坚守文化阵地，冒险保护手稿与遗物，主持编纂《鲁迅全集》。新中国成立后，历任政务院副秘书长、全国妇联副主席、民进中央副主席等职，毕生致力于鲁迅遗产保护与妇女、民主事业。';
            } else if (question.includes('子君')) {
                return '子君是鲁迅《伤逝》中的主人公，她是一个“觉醒后的无路可走”的新女性。初期她勇敢地说出“我是我自己的”，无视世俗眼光与涓生同居，是涓生启蒙成功的证明。然而，同居后她迅速陷入家务，变得“忙”且“怯弱”，在涓生看来成为追求“新路”的拖累。失业打击后，她的“勇气都失掉了”，最终被涓生以“真实”为武器精神驱逐。她的悲剧是无经济与社会基础的新女性在现实重力下的必然坠落，反映了五四时期女性解放的局限性。';
            } else if (question.includes('朱安')) {
                return '朱安（1878—1947），浙江绍兴人，鲁迅的原配夫人，是封建包办婚姻下的旧式女性。她缠足、不识字，恪守传统妇德，1906年奉母命与鲁迅结婚，二人精神隔阂极深，始终无共同生活。婚后她长期侍奉鲁迅母亲，操持家务，随周家迁居北京，默默守着名义上的婚姻。鲁迅南下与许广平定居后，她仍留在北平照料婆婆。鲁迅去世后，她生活清贫，却尽力守护鲁迅文稿遗物，1947年在北平孤寂离世。她一生温顺隐忍，是旧时代女性悲剧的缩影。';
            } else if (question.includes('鲁瑞')) {
                return '鲁瑞（1857—1943），鲁迅的母亲，会稽东北乡安桥头人，出身读书人家。她以自修得到能够看书的学力，在鲁家家道中落后，虽然不舍鲁迅的离去，但也尽力托举孩子。鲁迅选择出国留学时，她虽然哭泣，但还是支持了儿子的决定。她是鲁迅生命中重要的女性形象，对鲁迅的思想和创作产生了深远影响。';
            } else if (question.includes('杨二嫂')) {

            "杨二嫂": {
                img: "https://s41.ax1x.com/2026/03/09/peiooyd.png",
                intro: "被异化的小市民。杨二嫂从“豆腐西施”到“细脚伶仃的圆规”。以前她是被消费的“风景”，“终日坐着”，是吸引顾客的活招牌（“因为伊，这豆腐店的买卖非常好”）。她的价值附着于其外貌和店铺。而二十年后，她变成“凸颧骨，薄嘴唇”“细脚伶仃的圆规”。这个经典的比喻不仅描绘了她尖酸刻薄、极具攻击性的体态，更象征了她精神的畸形与工具化——像圆规一样刻薄、算计，围绕“利益”这个圆心打转，失去了人的丰满与温度。现在的她言语的讹诈与物质的窃取。首先她先声夺人，道德绑架。 以“我还抱过你咧！”开场，试图建立一种虚构的、不容反驳的恩情关系，为后续索取奠定道德基础。同时尖刻挖苦，施加压力。 用“贵人眼高”“放了道台”“三房姨太太”“八抬大轿”等完全是臆想的富贵场景来讽刺“我”，目的不是陈述事实，而是制造一种“你阔了就必须补偿我”的舆论压力和情感讹诈。赤裸索取，顺手牵羊。 直接讨要“破烂木器”，被婉拒后，立刻将对话定性为有钱人的吝啬（“愈有钱，便愈是一毫不肯放松”），并顺手偷走了“我母亲的一副手套”。这一“索要-偷窃”的行为链，是她生存哲学的完整实践：能用情面压榨就用情面，情面无效就直接窃取。她的生存存在一种小市民哲学，她拥有极度的物质主义与生存焦虑，她的世界一切都可兑换为物质利益。亲情、乡谊、面子，都是可以用来换取“破烂木器”的筹码。这背后是底层小市民在动荡社会中极度的生存不安全感与物质匮乏感。其次是严重的社会认知错位与臆想，她对“我”（一个在外漂泊的知识分子）的想象，完全基于她所理解的、僵化的封建官僚成功模式（道台、姨太太、大轿），这暴露了她与外部真实世界的巨大隔膜，思维停留在前一个时代。最后是精明算计下的可悲与可厌，她精明、泼辣、毫不掩饰自己的贪婪，具有一种扭曲的生命力，与闰土“恭敬”的麻木不同，她是主动进击的麻木，她的令人不适，但她的可厌恰恰是她被生活压榨、异化的结果。她偷手套的猥琐，与她年轻时“豆腐西施”的风光，形成残酷对比，展现了时间与社会如何将一个“被观赏者”扭曲为一个“掠夺者”。与此同时，杨二嫂构成了“我”“故乡梦”破碎的其中一极：杨二嫂则代表了物质与道德关系的崩坏。她的出现，让“回乡”不仅充满感伤，更充满了被骚扰、被算计的狼狈与荒诞。她像一面哈哈镜，照出了“我”与故乡之间所有温情纽带都已失效。记忆里美好的“故乡”，在现实里只剩下一个想从你身上刮点东西的“圆规”。她是“故乡”市侩、鄙俗、冰冷一面的肉身化体现。",

                intro: "涓生叙述中的子君：一个“退化”的谱系，在涓生的追忆中，子君经历了一个清晰的“堕落”轨迹：启蒙的偶像（“我是我自己的”）：初期她是勇敢的象征，说出振聋发聩的话，无视世俗眼光，眼中闪烁着“稚气的好奇的光泽”。她是涓生启蒙成功的证明，是他反抗旧世界的精神同盟与战利品。庸常的伴侣（“终日汗流满面”）：同居后，她迅速陷入家务（做饭、饲鸡、养狗），变得“忙”且“怯弱”。在涓生看来，她抛弃了思想追求，与官太太暗斗，成为他追求“新路”的拖累与障碍。她的形象从“苍白的圆脸”变为“胖了起来”、“手粗糙起来”。被弃的累赘（“无畏的子君也变了色”）：失业打击后，她的“勇气都失掉了”。涓生将经济困窘带来的焦虑，转化为对子君“浅薄”、“只知捶着衣角”的道德批判。最终，他以“真实”（“我已经不爱你了”）为武器，完成了对她的精神驱逐。隐藏视角下的子君：结构性压迫的承受者子君的“变化”实则是一个无经济与社会基础的新女性，在现实重力下的必然坠落：经济依附的绝境：子君脱离父家，便失去经济来源。她卖掉“唯一的金戒指和耳环”作为家庭股金，但这微薄贡献很快耗尽。她没有职业，家庭成为她唯一“事业”。涓生视家务为“功业”的讽刺，实则是她唯一可掌控的领域。她的“操劳”不是退化，而是在既定结构下唯一能做出的贡献与抵抗。社会支持的真空：她与家族决裂（叔子不再认她），同时被抛入一个充满“探索、讥笑”的陌生社区。她的社会关系网被彻底剥离，涓生成为她与世界的唯一纽带。她的“捶着衣角”，非因软弱，而是绝对的孤立无援。情感的双重剥削：涓生爱的，是作为启蒙符号的子君，而非具体的、会陷入日常的她。当符号落入现实，爱便消逝。他享受她带来的家庭温暖（“食品却比在会馆里时好得多了”），却鄙夷创造这温暖的劳作。子君的爱是全身心的（能背诵他求婚的每句话），而涓生的爱是有条件、建立在精神优越感之上的。“宠物”的隐喻：油鸡和阿随不仅是子君的情感寄托，更是她被物化命运的镜像。它们被饲养、被食用、被抛弃的过程，完美隐喻了子君在涓生价值体系中的位置：从珍贵的观赏品（无畏的新女性），到实用的生产者（操持家务），再到无用的累赘（需要被“放掉”）。她对阿随的悲愤，何尝不是对自身命运的预感。子君的核心悲剧是“觉醒后的无路可走”。",

        // 地点-人物映射
        const locationMap = {
            "虚拟": {
                "古轩亭口": ["夏四奶奶"],

                "故乡": ["阿长", "杨二嫂"],

                "后羿居所": ["嫦娥"],
                "首阳山": ["阿金姐"]
            },
            "现实": {
                "上海": ["许广平", "萧红"],
                "绍兴": ["鲁瑞", "朱安"],

                "柏林": ["凯绥·珂勒惠支"]

        // 记录当前上下文（虚拟/现实 + 地点）
        let currentContext = {
            type: "",
            location: ""
        };

        // 页面跳转函数
        function goToPage(pageId) {
            // 隐藏所有页面
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            // 显示目标页面
            document.getElementById(pageId).classList.add('active');
        }

        // 显示指定地点的人物头像
        function showCharacters(type, location) {
            currentContext.type = type;
            currentContext.location = location;
            
            const characters = locationMap[type][location];
            const container = document.getElementById('character-avatar-container');
            container.innerHTML = ""; // 清空容器
            
            // 生成头像列表
            characters.forEach(name => {
                const charData = characterData[name];
                const avatarItem = document.createElement('div');
                avatarItem.className = 'avatar-item';
                avatarItem.onclick = () => showCharacterDetail(name);
                
                avatarItem.innerHTML = `
                    <img src="${charData.img}" alt="${name}" class="avatar-img">
                    <span class="avatar-name">${name}</span>
                `;
                
                container.appendChild(avatarItem);
            });
            
            // 跳转到人物头像页面
            goToPage('page3-characters');
        }

        // 从人物头像页返回（回到对应的地点选择页）
        function goBackFromCharacters() {
            if (currentContext.type === "虚拟") {
                goToPage('page3-virtual');
            } else if (currentContext.type === "现实") {
                goToPage('page3-real');
            }
        }

        // 显示人物详情
        function showCharacterDetail(name) {
            const charData = characterData[name];
            
            // 填充详情内容
            document.getElementById('detail-name').textContent = name;
            document.getElementById('detail-intro').textContent = charData.intro;
            
            // 填充学术期刊列表
            const journalList = document.getElementById('detail-journal');
            journalList.innerHTML = "";
            charData.journal.forEach(journal => {
                const li = document.createElement('li');
                li.textContent = journal;
                journalList.appendChild(li);
            });
            
            // 跳转到详情页
            goToPage('page4-detail');
        }
    </script>
